name: Playwright E2E

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/ui/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/ui/**"
  # Manual trigger to (re)generate visual baselines on CI and commit them.
  # Actions tab → "Playwright E2E" → Run workflow → tick "update_baselines".
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate visual baselines and commit them back"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Normal CI — compares against committed baselines. Required / blocking.
  e2e:
    name: E2E Tests
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium

      - name: Build Storybook
        working-directory: packages/ui
        run: bun run storybook:build

      - name: Run Playwright tests
        working-directory: packages/ui
        run: bunx playwright test --shard=${{ matrix.shard }}
        env:
          CI: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: packages/ui/playwright-report/
          retention-days: 14

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: packages/ui/test-results/
          retention-days: 7

  # Manual baseline refresh — visual snapshots are platform-specific, so they
  # MUST be generated on CI (Linux), never committed from a dev's machine.
  # Regenerates only the visual suite (a11y/functional don't gate this) and
  # commits the resulting screenshots back to the triggering branch.
  update-baselines:
    name: Update visual baselines
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium

      - name: Build Storybook
        working-directory: packages/ui
        run: bun run storybook:build

      - name: Regenerate visual baselines
        working-directory: packages/ui
        run: bunx playwright test src/e2e/visual-regression.e2e.ts --update-snapshots
        env:
          CI: true

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/__screenshots__
          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test(ui): update visual regression baselines [skip ci]"
            git push
          fi
