# ── Product service ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: fabric
  labels:
    app: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - name: product
          image: ghcr.io/fabric/product:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4006
          envFrom:
            - configMapRef:
                name: fabric-env
          env:
            - name: PORT
              value: "4006"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fabric-secrets
                  key: PRODUCT_DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 4006
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4006
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: product-svc
  namespace: fabric
spec:
  selector:
    app: product
  ports:
    - protocol: TCP
      port: 4006
      targetPort: 4006
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-hpa
  namespace: fabric
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
